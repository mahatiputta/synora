<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNORA Collab Editor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Quill Editor CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- Inside your <head> tag, add this line right below quill.snow.css -->
    <link href="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.css" rel="stylesheet">

</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10">

    <div class="w-full max-w-4xl bg-white shadow-xl rounded-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800">Live Document Editor</h1>
            <span id="status" class="text-sm font-semibold text-green-600">Connected</span>
        </div>

        <!-- Editor Container -->
        <div id="editor" class="h-[60vh] border border-gray-300 rounded"></div>
    </div>

    <!-- Socket.io Client (Automatically served by Node backend) -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Quill Editor JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>



    <!-- And right before your client.js script, load the cursors JS module -->
    <script src="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.min.js"></script>

    <!-- Yjs and Client Logic (Module type allows ES imports in browser) -->
    <script type="module" src="client.js"></script>
</body>

</html>
